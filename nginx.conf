# 中层绩效考核系统 - Nginx 反向代理配置
# 部署位置: /etc/nginx/sites-available/perf-assessment
# 启用: ln -sf /etc/nginx/sites-available/perf-assessment /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# ===== HTTPS（强烈建议，HR 数据必须加密传输）=====
# 1) 安装证书工具: sudo apt install certbot python3-certbot-nginx
# 2) 把下面 server_name 的 _ 改成你的域名（需已解析到本机公网 IP）
# 3) 执行: sudo certbot --nginx -d your-domain.com
#    certbot 会自动申请证书并改写本配置启用 443 + 强制跳转 HTTPS

server {
    listen 80;
    server_name _;   # 上线后替换为你的域名，如 kaohe.example.com

    client_max_body_size 20m;  # Excel 导入需放宽上传大小

    # 静态资源由 nginx 直接提供，减轻 Python 压力
    location /static/ {
        alias /opt/performance_assessment/static/;
        expires 30d;
        access_log off;
    }

    # 应用请求转发给 gunicorn（本地 8000 端口）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
