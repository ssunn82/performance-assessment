# 中层绩效考核系统 - Nginx 反向代理配置
# 部署位置: /etc/nginx/sites-available/perf-assessment
# 启用: ln -sf /etc/nginx/sites-available/perf-assessment /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# ===== 端口说明 =====
# 对外访问端口: 8851（HTTP），访问地址 http://<服务器公网IP>:8851
# 内部应用端口: 8000（gunicorn，仅监听 127.0.0.1，公网不暴露）
#
# ===== 如需启用 HTTPS（可选）=====
# 默认 HTTP-01 校验要求公网 80 端口可达，与本项目「只用 8851」的设计冲突。
# 若确需 HTTPS，二选一：
#   方案 A：临时放行 80 -> certbot --nginx -d 你的域名 -> 放行 443 -> 再关闭 80
#   方案 B（不占 80/443，推荐）：使用 DNS-01 校验
#         sudo apt install -y certbot python3-certbot-dns-cloudflare
#         # 在 Cloudflare 申请 API Token，填入 /root/.cloudflare.ini 后执行：
#         sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.cloudflare.ini \
#              -d 你的域名  # 证书落到 /etc/letsencrypt/live/你的域名/
#         # 再把下面 443 server 段的 ssl_certificate 指向该目录并 reload nginx

server {
    listen 8851;
    server_name _;   # 上线后替换为你的域名，如 kaohe.example.com

    client_max_body_size 20m;  # Excel 导入需放宽上传大小

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 静态资源由 nginx 直接提供，减轻 Python 压力
    location /static/ {
        alias /opt/performance_assessment/static/;
        expires 30d;
        access_log off;
    }

    # 应用请求转发给 gunicorn（本地 8000 端口）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}

