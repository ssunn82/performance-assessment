# ============================================================
# 绩效考核系统 - 域名反代配置（配合 nginx 使用）
#
# 用途：让考核人只需输入 kaohe.你的域名.com 即可通过 HTTPS 访问，
#       而服务器防火墙无需开放 80 / 443。
#
# 安装：
#   sudo cp nginx-domain.conf /etc/nginx/sites-available/perf-assessment
#   sudo ln -sf /etc/nginx/sites-available/perf-assessment /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 配套环境变量（重要，否则二维码里的链接会带内网 IP）：
#   BASE_URL=https://kaohe.你的域名.com
# ============================================================

# ============================================================
# 方案 A：Cloudflare 边缘 TLS（推荐，源站只开 8443）
# ----------------------------------------------------------------
# 原理：浏览器 → Cloudflare 边缘节点(443) → 你的服务器(8443)
#   · 证书由 Cloudflare 自动签发续期，永不过期
#   · 源站真实 IP 不暴露，外面看不到你的服务器地址
#   · 源站与 Cloudflare 之间建议也加密（下面默认 plain，注释里有 https 写法）
#
# 前置条件：
#   1. 域名已托管到 Cloudflare
#   2. DNS 记录 kaohe 指向服务器公网 IP，且代理状态为「已代理」（橙色云朵）
#   3. Cloudflare → SSL/TLS 模式选 Full (strict)
#
# 防火墙只需放行：TCP 8443（不要开 80、443、8851）
# ============================================================

server {
    # 8443 是 Cloudflare 支持的 HTTPS 代理端口之一
    listen 8443 ssl;
    server_name kaohe.你的域名.com;

    client_max_body_size 20m;  # Excel 导入需放宽上传大小

    # ---- 方案 A 默认：Cloudflare 到源站走明文 HTTP ----
    # 若要全链路加密，改用 Cloudflare Origin CA 证书并把 ssl_protocols 下的
    # listen 换为 8443 ssl、ssl_certificate 指向下载的 origin 证书
    #
    # ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 静态资源由 nginx 直接提供
    location /static/ {
        alias /opt/performance_assessment/static/;
        expires 30d;
        access_log off;
    }

    # 应用请求转发给 gunicorn（本地 8000 端口）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 保留 Cloudflare 传来的真实客户端 IP，便于日志排查
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}


# ============================================================
# 方案 B：源站自管证书（不用 Cloudflare，源站直接开 443）
# ----------------------------------------------------------------
# 若你没有 Cloudflare，或不想把域名托管过去，可用此方案。
# 证书签发用 DNS-01 校验（不占用 80 端口）：
#   sudo apt install -y certbot python3-certbot-dns-cloudflare
#   # Cloudflare 控制台申请 API Token（Zone:DNS:Edit 权限），写入 /root/.cloudflare.ini：
#   #   dns_cloudflare_api_token = <你的Token>
#   sudo chmod 600 /root/.cloudflare.ini
#   sudo certbot certonly --dns-cloudflare \
#        --dns-cloudflare-credentials /root/.cloudflare.ini -d kaohe.你的域名.com
#   # 证书默认 90 天有效，certbot 的 systemd timer 会自动续期，无需手工干预
#
# 防火墙需放行：TCP 443
# ============================================================
